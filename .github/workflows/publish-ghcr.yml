name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Verify and publish versioned image
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2 (Node 20), pinned to its immutable release commit.
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # actions/setup-java v5.5.0 (Node 24), pinned to its immutable release commit.
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate the release tag and source state
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "tag" ]]
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only stable vMAJOR.MINOR.PATCH tags may publish images." >&2
            exit 1
          }

          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-list -n 1 "${GITHUB_REF}")"
          git merge-base --is-ancestor "${TAG_COMMIT}" origin/main || {
            echo "Release tag ${GITHUB_REF_NAME} is not reachable from origin/main." >&2
            exit 1
          }

          VERSION="${GITHUB_REF_NAME#v}"
          git show "${TAG_COMMIT}:docs/releases/v${VERSION}.md" | grep -q '[^[:space:]]' || {
            echo "docs/releases/v${VERSION}.md must exist and be non-empty at the tagged commit." >&2
            exit 1
          }

          PROJECT_VERSION="$(mvn --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          [[ "${PROJECT_VERSION}" == "${VERSION}" ]] || {
            echo "Tag version ${VERSION} does not match Maven project.version ${PROJECT_VERSION}." >&2
            exit 1
          }

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_commit=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Build and test the Maven reactor
        run: mvn --batch-mode clean verify

      - name: Build and push both immutable image tags
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: g2rain/g2rain-department
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          mvn --batch-mode -pl g2rain-department-startup -am jib:build \
            -Djib.to.image="${IMAGE}:${{ steps.release.outputs.version }}" \
            -Djib.to.tags="sha-${{ steps.release.outputs.tag_commit }}" \
            -Djib.to.auth.username="${REGISTRY_USERNAME}" \
            -Djib.to.auth.password="${REGISTRY_PASSWORD}"

      - name: Publish success summary
        run: |
          {
            echo '## GHCR image published'
            echo
            echo 'Both required tags were pushed successfully:'
            echo '- `ghcr.io/g2rain/g2rain-department:${{ steps.release.outputs.version }}`'
            echo '- `ghcr.io/g2rain/g2rain-department:sha-${{ steps.release.outputs.tag_commit }}`'
          } >> "$GITHUB_STEP_SUMMARY"
